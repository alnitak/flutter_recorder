// The native code is built by the Dart build hook (hook/build.dart); this
// Gradle module only provides the FlutterRecorderPlugin class, which observes
// the FlutterEngine lifecycle.

group = "flutter.recorder.flutter_recorder"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.0")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "flutter.recorder.flutter_recorder"

    compileSdk = 35

    defaultConfig {
        minSdk = 21
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}
