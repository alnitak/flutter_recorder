name: flutter_recorder_example
description: "Demonstrates how to use the flutter_recorder plugin."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_recorder:
    path: ../

  flutter_soloud: #^4.0.0
    path: ../../flutter_soloud
  audio_session: ^0.2.3

  cupertino_icons: ^1.0.8
  logging: ^1.3.0
  open_filex: ^4.6.0
  path_provider: ^2.1.5
  permission_handler: ^13.0.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
